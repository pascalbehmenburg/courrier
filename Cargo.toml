[workspace]
resolver = "2"
members = ["crates/core", "crates/migrate", "crates/server", "desktop/src-tauri"]
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Pascal Behmenburg <pascal@behmenburg.xyz>"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
